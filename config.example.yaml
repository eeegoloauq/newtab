# Copy this, throw the links out, put yours in. Everything that is not a
# link name has an English default, so a title and one section is a valid
# config.

title: newtab
listen: 127.0.0.1:5669
icon_dir: ./icons
columns: 4

search:
  engine: https://duckduckgo.com/?q=%s

sections:
  - name: Home
    style: live
    links:
      - {name: Hypervisor, url: "https://198.51.100.10:8006/"}
      - {name: Photos, url: "https://photos.example.com/", check: Photos}
      - {name: Music, url: "https://music.example.com/", check: Music}
      - {name: Files, url: "https://files.example.com/", check: Files}
      - {name: Git, url: "http://198.51.100.12:3000/", check: Git}

  - name: Read
    style: list
    links:
      - {name: Hacker News, url: "https://news.ycombinator.com/", alias: [hn]}
      - {name: Reddit, url: "https://www.reddit.com/"}
      - {name: The Verge, url: "https://www.theverge.com/"}
      - {name: Ars Technica, url: "https://arstechnica.com/"}
      - {name: Wikipedia, url: "https://en.wikipedia.org/"}
      - {name: arXiv, url: "https://arxiv.org/"}
      - {name: Substack, url: "https://substack.com/"}
      - {name: Internet Archive, url: "https://archive.org/"}

  - name: Code
    style: list
    links:
      - {name: GitHub, url: "https://github.com/"}
      - {name: GitLab, url: "https://gitlab.com/"}
      - {name: Stack Overflow, url: "https://stackoverflow.com/"}
      - {name: MDN, url: "https://developer.mozilla.org/"}
      - {name: Go Packages, url: "https://pkg.go.dev/"}
      - {name: npm, url: "https://www.npmjs.com/"}
      - {name: Docker Hub, url: "https://hub.docker.com/"}
      - {name: Godbolt, url: "https://godbolt.org/", alias: [compiler explorer]}

  - name: Watch
    style: list
    links:
      - {name: YouTube, url: "https://www.youtube.com/"}
      - {name: Netflix, url: "https://www.netflix.com/"}
      - {name: Twitch, url: "https://www.twitch.tv/"}
      - {name: Letterboxd, url: "https://letterboxd.com/"}
      - {name: IMDb, url: "https://www.imdb.com/"}
      - {name: Vimeo, url: "https://vimeo.com/"}

  - name: Listen
    style: list
    links:
      - {name: Spotify, url: "https://open.spotify.com/"}
      - {name: Bandcamp, url: "https://bandcamp.com/"}
      - {name: SoundCloud, url: "https://soundcloud.com/"}
      - {name: Last.fm, url: "https://www.last.fm/"}
      - {name: NTS Radio, url: "https://www.nts.live/"}

  - name: Make
    style: list
    links:
      - {name: Figma, url: "https://www.figma.com/"}
      - {name: Excalidraw, url: "https://excalidraw.com/"}
      - {name: Notion, url: "https://www.notion.so/"}
      - {name: regex101, url: "https://regex101.com/"}
      - {name: CyberChef, url: "https://gchq.github.io/CyberChef/"}
      - {name: Wolfram Alpha, url: "https://www.wolframalpha.com/"}

  - name: Talk
    style: list
    links:
      - {name: Discord, url: "https://discord.com/app"}
      - {name: Telegram, url: "https://web.telegram.org/"}
      - {name: Mastodon, url: "https://mastodon.social/"}
      - {name: LinkedIn, url: "https://www.linkedin.com/"}
      - {name: Gmail, url: "https://mail.google.com/"}

  - name: Life
    style: list
    links:
      - {name: Maps, url: "https://www.google.com/maps"}
      - {name: Booking, url: "https://www.booking.com/"}
      - {name: Amazon, url: "https://www.amazon.com/"}
      - {name: Steam, url: "https://store.steampowered.com/"}
      - {name: Duolingo, url: "https://www.duolingo.com/"}

# Optional. Temperature and a glyph beside the field, from Open-Meteo:
# no account and no key. Delete the block to have none.
weather:
  latitude: 59.9386
  longitude: 30.3141
  every: 15m

# Optional. The page is built to be read, and the defaults are the ones
# it was designed with; these are here for the cases where they are wrong
# — a bright room, a big screen, a photograph you like.
theme:
  # background: "#141312"
  # ink: "#e8e4da"
  # muted: "#8a8478"
  # down: "#ff6d63"
  # font_size: 17
  # image: /var/lib/newtab/dusk.png
  # image_dim: 0.55

# Optional. What an uptime monitor knows, read-only. Rows match checks by
# the host they point at, or by `check:` on the link.
status:
  url: http://198.51.100.20:5665/api/status
  every: 30s
  # problems: say nothing while the last day was perfect, show the uptime
  # figure once it was not. Also: latency, uptime24h, uptime7d, never.
  tail: problems

# Optional. Three numbers from a hypervisor, on the row of the link that
# is it. Commented out because it needs a token: newtab validate refuses
# a config whose token variable is empty, and an example anyone can load
# is worth more than an example with everything switched on.
# proxmox:
#   url: https://198.51.100.10:8006
#   token_env: NEWTAB_PROXMOX_TOKEN   # user@realm!id=secret, from the environment
#   attach: Hypervisor
#   every: 30s
#   insecure: true
