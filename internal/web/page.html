<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>{{.Title}}</title>
<style>{{.CSS}}</style>
</head>
<body data-engine="{{.Engine}}">
<form class="find" id="find" autocomplete="off">
  <label for="q">фильтр</label>
  <input id="q" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autofocus
         aria-describedby="note">
  <p class="note" id="note" aria-live="polite">Enter — первая ссылка, иначе поиск</p>
</form>

<main>
{{range $sec := .Sections}}
  <section class="sec{{if $sec.Live}} live{{end}}" data-sec>
    <h2>{{$sec.Name}}</h2>
    <ul>
    {{range $sec.Links}}
      <li><a href="{{.URL}}" data-key="{{.Key}}" data-name="{{.Name}}"
        >{{if .Icon}}<img class="ico" src="{{.Icon}}" alt="" width="16" height="16"
        >{{else}}<span class="ico none" aria-hidden="true"></span>{{end
        }}{{if $sec.Live}}<span class="dot" aria-hidden="true"></span>{{end
        }}<span class="name">{{.Name}}</span
        >{{if .Tail}}<span class="tail">{{.Tail}}</span>{{end}}</a></li>
    {{end}}
    </ul>
  </section>
{{end}}
</main>

<script>{{.JS}}</script>
</body>
</html>
