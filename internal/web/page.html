<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>{{.Title}}</title>
<style>{{.CSS}}</style>
</head>
<body data-engine="{{.Engine}}">
<form class="find" id="find" autocomplete="off">
  <label for="q" class="sr">{{.Text.Search}}</label>
  <input id="q" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autofocus>
</form>

<!-- The icon a browser shows for a page with no favicon of its own. One
     copy, referenced by every row that needs it. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/></symbol></svg>

<main>
{{range $sec := .Sections}}
  <section class="sec{{if $sec.Live}} live{{end}}" data-sec>
    <h2>{{$sec.Name}}</h2>
    <ul>
    {{range $sec.Links}}
      <li><a href="{{.URL}}" data-key="{{.Key}}" data-name="{{.Name}}"
        >{{if .Icon}}<img class="ico" src="{{.Icon}}" alt="" width="20" height="20"
        >{{else}}<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#globe"/></svg>{{end
        }}<span class="name">{{.Name}}</span
        >{{if .Tail}}<span class="tail">{{.Tail}}</span>{{end}}</a></li>
    {{end}}
    </ul>
  </section>
{{end}}
</main>

<script>{{.JS}}</script>
</body>
</html>
