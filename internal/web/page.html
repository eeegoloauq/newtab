<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>{{.Title}}</title>
<style>{{.CSS}}</style>
</head>
<body data-engine="{{.Engine}}" data-opens="{{.Text.Opens}}" data-web="{{.Text.WebSearch}}">
<!-- Both glyphs the page draws itself, defined once. They come first:
     a <use> placed before its target does not resolve in Chrome. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="glyph-find" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></symbol><symbol id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/></symbol></svg>
<form class="find" id="find" autocomplete="off">
  <label for="q" class="sr">{{.Text.Search}}</label>
  <span class="box">
    <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#glyph-find"/></svg>
    <input id="q" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autofocus
           placeholder="{{.Text.Search}}">
    <p class="sr" id="said" aria-live="polite"></p>
  </span>
</form>

<main>
{{range .Columns}}<div class="col">
{{range $sec := .Sections}}
  <section class="sec{{if $sec.Live}} live{{end}}" data-sec>
    <h2>{{$sec.Name}}</h2>
    <ul>
    {{range $sec.Links}}
      <li{{if .Down}} class="down"{{end}}><a href="{{.URL}}" data-key="{{.Key}}" data-name="{{.Name}}"
        >{{if .Icon}}<img class="ico" src="{{.Icon}}" alt="" width="20" height="20"
        >{{else}}<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#globe"/></svg>{{end
        }}<span class="name">{{.Name}}</span
        >{{if .Tail}}<span class="tail"{{if .TailHint}} title="{{.TailHint}}"{{end}}>{{.Tail}}</span>{{end}}</a></li>
    {{end}}
    </ul>
  </section>
{{end}}
</div>{{end}}
</main>

<script>{{.JS}}</script>
</body>
</html>
