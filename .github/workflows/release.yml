name: release

on:
  push:
    tags: ["v*"]
  # A tag that arrives together with the branch does not start this
  # workflow, so it has to be startable by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -o dist/newtab-linux-$arch ./cmd/newtab
          done
          cd dist && sha256sum newtab-* > SHA256SUMS
      # A ready-to-load extension built from the example config, so that
      # trying this out is unzip-and-load rather than build-and-run. The
      # icons are fetched here, where the network is not somebody's home
      # connection.
      - name: extension
        run: |
          go run ./cmd/newtab icons config.example.yaml || true
          go run ./cmd/newtab extension config.example.yaml dist/newtab-extension
          cd dist && zip -qr newtab-extension-offline.zip newtab-extension && rm -rf newtab-extension
          cd .. && cp -r contrib/extension-live dist/newtab-live
          cd dist && zip -qr newtab-extension-live.zip newtab-live && rm -rf newtab-live
          sha256sum newtab-extension-offline.zip newtab-extension-live.zip >> SHA256SUMS

      # The release notes are the message of the annotated tag; the generated
      # commit list is appended after them.
      - name: Release notes from the tag message
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git config --global --add safe.directory "$PWD"
          : > "$RUNNER_TEMP/notes.md"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
