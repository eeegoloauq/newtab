name: release

on:
  push:
    tags: ["v*"]
  # A tag that arrives together with the branch does not start this
  # workflow, so it has to be startable by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -o dist/newtab-linux-$arch ./cmd/newtab
          done
          cd dist && sha256sum newtab-* > SHA256SUMS
      # A ready-to-load extension built from the example config, so that
      # trying this out is unzip-and-load rather than build-and-run. The
      # icons are fetched here, where the network is not somebody's home
      # connection.
      - name: extension
        run: |
          go run ./cmd/newtab icons config.example.yaml || true
          go run ./cmd/newtab extension config.example.yaml dist/extension
          cd dist && zip -qr newtab-extension-example.zip extension && rm -rf extension
          sha256sum newtab-extension-example.zip >> SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
