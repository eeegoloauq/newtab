name: release

on:
  push:
    tags: ["v*"]
  # A tag that arrives together with the branch does not start this
  # workflow, so it has to be startable by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -o dist/newtab-linux-$arch ./cmd/newtab
          done
          cd dist && sha256sum newtab-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
