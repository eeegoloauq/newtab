# A start page. Everything on one screen, filtered as you type.
#
# The links below are a demonstration, not a recommendation — swap them
# for yours. Anything not a link name has a sane English default, so the
# shortest working config is a title and a section.

title: newtab
listen: 127.0.0.1:5669
icon_dir: ""
columns: 4

search:
  # %s is where the query goes. Any engine works.
  engine: https://duckduckgo.com/?q=%s

sections:
  # style: live — things that can be down. Their rows can show what a
  # monitor knows; see `status` at the bottom.
  - name: Home
    style: live
    links:
      - name: Hypervisor
        url: https://198.51.100.10:8006/
      - name: Files
        url: https://files.example.com/
        check: Files
      - name: Photos
        url: https://photos.example.com/
        alias: [pictures]
        check: Photos
      - name: Music
        url: https://music.example.com/
        check: Music
      - name: Git
        url: http://198.51.100.12:3000/
        check: Git

  # style: list — plain bookmarks. Icon, name, nothing else.
  - name: Read
    style: list
    links:
      - name: Hacker News
        url: https://news.ycombinator.com/
        alias: [hn]
      - name: Lobsters
        url: https://lobste.rs/
      - name: Wikipedia
        url: https://en.wikipedia.org/
      - name: arXiv
        url: https://arxiv.org/
      - name: Marginalia
        url: https://search.marginalia.nu/
      - name: Internet Archive
        url: https://archive.org/

  - name: Code
    style: list
    links:
      - name: GitHub
        url: https://github.com/
      - name: Go Packages
        url: https://pkg.go.dev/
      - name: MDN
        url: https://developer.mozilla.org/
      - name: Stack Overflow
        url: https://stackoverflow.com/
      - name: crates.io
        url: https://crates.io/
      - name: Godbolt
        url: https://godbolt.org/
        alias: [compiler explorer]

  - name: Tools
    style: list
    links:
      - name: Excalidraw
        url: https://excalidraw.com/
      - name: regex101
        url: https://regex101.com/
      - name: explainshell
        url: https://explainshell.com/
      - name: Wolfram Alpha
        url: https://www.wolframalpha.com/
      - name: CyberChef
        url: https://gchq.github.io/CyberChef/

  - name: Elsewhere
    style: list
    links:
      - name: Bandcamp
        url: https://bandcamp.com/
      - name: NTS Radio
        url: https://www.nts.live/
      - name: Letterboxd
        url: https://letterboxd.com/
      - name: Are.na
        url: https://www.are.na/
      - name: Radio Garden
        url: https://radio.garden/
      - name: xkcd
        url: https://xkcd.com/

# The demo invents the state a monitor would report; only the row that
# carries the hypervisor numbers has to be named here.
proxmox:
  attach: Hypervisor
