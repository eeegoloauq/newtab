# The page `newtab demo` draws. The links are a shop window: they are
# there to show what forty-odd rows look like, not to be a recommendation.

title: newtab
listen: 127.0.0.1:5669
icon_dir: ""
columns: 4

search:
  engine: https://duckduckgo.com/?q=%s
  prefixes:
    g: https://www.google.com/search?q=%s
    w: https://en.wikipedia.org/w/index.php?search=%s
    gh: https://github.com/search?q=%s

sections:
  - name: Home
    style: live
    links:
      - {name: Hypervisor, url: "https://198.51.100.10:8006/"}
